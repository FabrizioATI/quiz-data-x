<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz DataX Developer</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--tx:#1b2430;--mut:#5b6677;--pri:#2e5597;--prib:#e8eefb;--ok:#1a7f45;--okb:#e3f5ea;--bad:#b83227;--badb:#fdeceb;--bd:#d9e0ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.w{max-width:780px;margin:auto;padding:22px 16px 48px}h1{font-size:24px;margin:0}.sub{color:var(--mut);margin:2px 0 16px;font-size:14px}.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.btn,.chip{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer}.chip{font-size:14px;border-radius:14px}.btn.p,.chip.on{background:var(--pri);border-color:var(--pri);color:white}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-top:12px;box-shadow:0 2px 10px #0000000d}.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;background:var(--pri);transition:width .2s}.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;gap:10px}.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--pri);background:var(--prib);border-radius:99px;padding:2px 10px;margin-bottom:10px}.q{font-size:19px;font-weight:650;margin:0 0 14px}.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}.o:hover{border-color:var(--pri)}.o input{margin-top:6px;accent-color:var(--pri)}.o.ok{border-color:var(--ok);background:var(--okb)}.o.no{border-color:var(--bad);background:var(--badb)}.o:disabled{cursor:default}.fb{padding:12px 14px;border-radius:12px;font-weight:600;margin-top:10px}.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--badb);color:var(--bad)}.big{font-size:38px;font-weight:800;margin:6px 0}.topic{padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin:8px 0}.small{font-size:13px;color:var(--mut)}#pdf-viewer{margin:12px 0}#pdf-viewer iframe{width:100%;height:min(78vh,900px);border:1px solid var(--bd);border-radius:12px;background:white}.pdf-original{display:block;margin:10px 0;color:var(--pri)}#pdf-reader{display:none}.pdf-question{padding:14px 12px;border-bottom:1px solid var(--bd)}.pdf-question h2{font-size:16px;line-height:1.4;margin:0 0 8px}.pdf-choice{margin:4px 0;padding:3px 7px;border-radius:3px}.pdf-choice.correct{background:#fff36b;color:#111}@media(max-width:700px){#pdf-viewer iframe{display:none}#pdf-reader{display:block}.pdf-original{font-size:14px}}button:disabled{opacity:.45;cursor:default}@media(prefers-color-scheme:dark){:root{--bg:#12161d;--card:#1b222c;--tx:#e8edf5;--mut:#9aa7b8;--pri:#7fa6f0;--prib:#222d44;--ok:#5fd18f;--okb:#17301f;--bad:#ff8b80;--badb:#3a1d1b;--bd:#2c3644}}
</style>
</head><body><main class="w">
<h1>Quiz: DataX Developer</h1><p class="sub">Practica con las preguntas del balotario DataX - NETEC</p>
<div class="row" id="opts"></div><section id="pdf-viewer" hidden><iframe src="Cuestionario%20%40DataX%20Developer%20(3)%201.pdf" title="Cuestionario DataX Developer PDF"></iframe><a class="pdf-original" href="Cuestionario%20%40DataX%20Developer%20(3)%201.pdf" target="_blank" rel="noopener">Abrir PDF original</a><div id="pdf-reader"></div></section><div id="app"></div>
</main><script>
const D=[
[1,"Se puede usar la opción deleteOnOrigin en HDFS Master",["VERDADERO","FALSO"],[1]],
[1,"El comodín (*) para el nombre de los archivos se puede usar en:",["Nunca","Ambos D.O","El D.O de origen","El D.O de destino"],[2]],
[1,"¿A qué grupo pertenece el usuario de DataX para acceder al servidor HOST (máscaras RACF)?",["DATAX01","PBDATAX","USDATAX","DATAXUS"],[1]],
[1,"Para la promoción de componentes DataX, ¿se debe tener un MSA o documento de análisis como sustento para un pase a producción?",["FALSO","VERDADERO"],[1]],
[1,"El proyecto puede ejecutar transferencias en producción desde:",["Malla temporal, periódica o eventual de Control-M","APX Batch","ECS-CLI","Consola de DataX"],[0]],
[1,"¿Qué componente representa la definición de la información que va a ser transmitida?",["Data Object","Schema","Adapter","Transfer"],[1]],
[1,"El campo myfield.mysubfield en un schema asociado a un D.O de Salesforce debe configurarse así:",["myfield_punto_mysubfield","myfield_._mysubfield","myfield_dot_mysubfield","myfield_mysubfield"],[2]],
[1,"¿Qué valor se debe configurar en el campo run-as al crear un job de tipo OS para una transmisión DataX?",["job-ctlm","job-datax","datax-ctlm","datax"],[2]],
[1,"¿Quién es el equipo de soporte de Control-M?",["Infraestructura","El equipo de proyecto","Kyndryl México","DataX Perú"],[2]],
[1,"¿Qué permiso falta otorgar en las máscaras RACF cuando aparece el error RACF0951: The User is not authorized to access the dataset?",["ALTER","ALL","READER","SELECTED"],[2]],
[1,"¿A qué equipo debe contactar el proyecto para aprobar una transferencia a un servidor SFTP externo?",["Solution Architect","Data Security Perú","IPA","Security Architect"],[1]],
[1,"¿Cómo se debe reportar una incidencia en una transferencia productiva?",["Ticket Helix de tipo INC","Mensaje directo al Arq. Asociado","Email al buzón de DataX","Google Meet al Arq. Asociado"],[0]],
[1,"¿Cuál de las operaciones aritméticas NO se puede implementar a través de las transformaciones?",["Multiplicación (*)","Suma (+)","Porcentaje (%)","Promedio"],[3]],
[1,"¿Qué hace la transformación CleanNulls?",["Cambia todos los valores a null de un atributo determinado","Cambia el valor null por vacío","Elimina los registros que tienen algún campo null","Lista los registros que tienen campos null"],[2]],
[2,"El test de conectividad (Connectivity Test) se puede realizar para entornos previos y productivos",["VERDADERO","FALSO"],[0]],
[2,"¿Qué modo NO está permitido en Oracle?",["SELECT","DELETE","UPDATE","APPEND"],[1]],
[2,"El formato fixed permite datos de longitud variable",["FALSO","VERDADERO"],[0]],
[2,"¿Qué adaptador NO está disponible?",["S3","Oracle Perú","Google Drive","Connect Direct Windows"],[2]],
[2,"Las transferencias siempre deben tener un schema definido en origen y destino",["VERDADERO","FALSO"],[1]],
[2,"Para volumetrías muy altas se recomienda el uso de DataX para transferir y/o eliminar archivos desde o hacia un bucket",["FALSO","VERDADERO"],[1]],
[2,"¿En qué entornos se pueden realizar cambios en las transferencias, D.O. y schemas sin requerir despliegue del componente?",["Producción (pro)","Desarrollo (dev)","Calidad (au)","Test (int)"],[1]],
[2,"¿Qué servicio almacena los datos de seguridad (usuario, password o certificado) usados por los adapters en todos los namespaces?",["Credentials","Secrets","Key","DataX"],[1]],
[2,"¿Qué tipo de job (job type) se debe configurar para una transmisión DataX?",["OS","File Transfer","FileWatcher","z-OS"],[0]],
[2,"No se pueden anidar o asociar JOBS dentro de una malla para que una dependa de la respuesta de su antecesor",["VERDADERO","FALSO"],[1]],
[2,"¿Qué tipo de adaptador requiere apertura de FW?",["Salesforce","Oracle physics","Connect Direct XCOM","SFTP Interno"],[3]],
[3,"Si una transferencia utiliza un adaptador que se conecta al servidor XCOM, ¿de quién debe tener el VoBo para desplegarse en producción?",["Solution Architect","Security Architect","ARQ_IPA","Producción Perú"],[3]],
[3,"La transformación Replace solo se puede aplicar a un campo por vez",["VERDADERO","FALSO"],[0]],
[3,"¿Qué tipo de archivos NO se deben transmitir sin autorización previa de DataX Local, Seguridad de Datos y Seguridad de Proyectos?",["CSV","EXE","CTL","TXT"],[1]],
[3,"¿Está permitido transferir archivos que contienen comandos SQL o JavaScript?",["FALSO","VERDADERO"],[0]],
[3,"Los adaptadores en DataX pueden ser reutilizados directamente en diferentes proyectos desde diferentes UA's (sin usar el D.O.)",["FALSO","VERDADERO"],[1]],
[3,"Las transferencias no tienen limitaciones de cantidad de registros, peso o tiempo de ejecución",["VERDADERO","FALSO"],[1]],
[3,"Si se modifica el valor Irecl en un D.O. de Connect Direct, afecta la cantidad de bytes transmitidos por DataX",["FALSO","VERDADERO"],[1]],
[3,"En una transferencia donde cada D.O. está en una UA diferente, ¿en qué UA debe crearse la transferencia?",["UA origen","UA DXPO","Cualquier UA","UA destino"],[3]],
[3,"Control-M puede ejecutar el llamado a una transferencia DataX varias veces al mismo tiempo",["VERDADERO","FALSO"],[0]],
[3,"En transferencias productivas que usan el driver de CoreDocuments, ¿a qué bot se deben dar permisos en Epsilon para evitar el error 403 getting object?",["bot-datax-epsilon@live-02.ecs","bot-datax-epsilon@work-01.ecs","bot-datax-epsilon@live-01.ecs","bot-datax-epsilon@work-02.ecs"],[0]],
[3,"¿Qué formato deben tener las máscaras RACF?",["<entorno>.<UA>.FIX.DX.** (ejemplo: PEBP.MPFD.FIX.DX.**)","DATAX.<UA>.FIX.** (ejemplo: DATAX.MPFD.FIX.**)","<UA>.<Entorno>.<Año>.<ARCHIVO>.** (ejemplo: MPFD.PEBP.2023.SYSTEM.**)","<UA>.<Entorno>.FIX.DX.** (ejemplo: MPFD.PEBP.FIX.DX.**)"],[0]],
[3,"Para un esquema de Salesforce, el nombre account_id_r_dot_unique_id_c NO equivale a account_id_r_unique_id_c",["FALSO","VERDADERO"],[1]],
[3,"En las transformaciones NO puedo:",["Tokenizar / Encriptar datos","Agrupar por algunas columnas","Sumar / Restar campos","Aplicar un filtro SQ"],[1]],
[4,"¿Para qué componente se debe considerar la nomenclatura p{{UUAA}}{{origen}}{{destino}}{{descripción}}{{n}}?",["Transferencias","Schemas","Adapter","D.O."],[0]],
[4,"¿Cuál es el límite para los volúmenes de datos que puedo intercambiar con DataX?",["150 GB","1 TB","Ilimitado","100 GB"],[0]],
[4,"La revisión de la malla se gestiona a través de:",["REQ DWP / Helix","CRQ vía Remedy / Helix","Ticket JIRA al Holding","Revisión vía página web de Kyndryl"],[1]],
[4,"Las credenciales de un adaptador Connect Direct HOST son solicitadas e ingresadas por el equipo:",["Seguridad","IPA","Proyecto","Holding"],[0]],
[4,"Para una transmisión a un SFTP externo, ¿qué firewalls se deben aperturar?",["Firewall Perú","Firewall CCR México","Ninguna","Firewall NextGen"],[2]],
[4,"¿Qué transformación debe aplicarse primero?",["ConcatColumns","DropColumns","InitNulls","Literal"],[2]]
];
const $=s=>document.querySelector(s),app=$("#app"),opts=$("#opts"),pdf=$("#pdf-viewer"),pdfReader=$("#pdf-reader");
let pool=[],i=0,selected=[],checked=false,correct=0,wrong=[],pdfOpen=false;
const shuffle=a=>{a=[...a];for(let n=a.length-1;n>0;n--){const j=Math.random()*(n+1)|0;[a[n],a[j]]=[a[j],a[n]]}return a};
function src(){return D.map((q,k)=>k)}
function build(){pool=shuffle(src());i=0;selected=[];checked=false;correct=0;wrong=[];draw()}
function renderPdfReader(){pdfReader.innerHTML=D.map((q,n)=>`<article class="pdf-question"><h2>${n+1}. ${q[1]}</h2>${q[2].map((o,j)=>`<div class="pdf-choice ${q[3].includes(j)?"correct":""}">${String.fromCharCode(97+j)}. ${o}</div>`).join("")}</article>`).join("")}
function draw(){opts.innerHTML=`<button class="chip" data-action="new">🔀 Nuevo intento</button><button class="chip" data-action="pdf">${pdfOpen?"✕ Cerrar PDF":"📄 Ver PDF"}</button>`;quiz()}
function quiz(){if(!pool.length){app.innerHTML='<div class="card">No hay preguntas disponibles.</div>';return}if(i>=pool.length){const pct=Math.round(correct/pool.length*100);app.innerHTML=`<div class="card"><div class="big">${correct} / ${pool.length} · ${pct}%</div><p>${pct>=80?"¡Excelente!":pct>=60?"Vas bien, sigue practicando.":"Repasa el balotario y vuelve a intentarlo."}</p><div class="row"><button class="btn p" data-action="new">🔀 Nuevo intento</button>${wrong.length?`<button class="btn" data-action="retry">Repetir falladas (${wrong.length})</button>`:""}</div>${wrong.map(k=>`<div class="topic">${D[k][1]}<br><b>Correcta: ${D[k][3].map(a=>D[k][2][a]).join(" · ")}</b></div>`).join("")}</div>`;return}const q=D[pool[i]],multi=q[3].length>1;app.innerHTML=`<div class="bar"><i style="width:${i/pool.length*100}%"></i></div><div class="meta"><span>Pregunta ${i+1} de ${pool.length}</span><span>Aciertos: ${correct}</span></div><div class="card"><span class="tag">${multi?"Selecciona todas las correctas":"Pregunta del balotario"}</span><p class="q">${q[1]}</p>${q[2].map((o,j)=>`<label class="o ${checked?(q[3].includes(j)?"ok":selected.includes(j)?"no":""):""}"><input type="${multi?"checkbox":"radio"}" name="answer" value="${j}" ${selected.includes(j)?"checked":""} ${checked?"disabled":""}><span>${o}</span></label>`).join("")}${checked?`<div class="fb ${q[3].length===selected.length&&q[3].every(x=>selected.includes(x))?"ok":"no"}">${q[3].length===selected.length&&q[3].every(x=>selected.includes(x))?"✓ ¡Correcto!":"✗ Incorrecto. Respuesta correcta: "+q[3].map(x=>q[2][x]).join(" · ")}</div><div class="row"><button class="btn p" data-action="next">${i<pool.length-1?"Siguiente →":"Ver resultado"}</button></div>`:`<p class="small">${multi?"Esta pregunta puede tener varias respuestas correctas.":"Elige una respuesta."}</p><div class="row"><button class="btn p" data-action="check" ${selected.length?"":"disabled"}>Validar</button></div>`}</div>`}
app.addEventListener("change",e=>{if(e.target.name!=="answer"||checked)return;const q=D[pool[i]],v=+e.target.value;if(q[3].length===1)selected=[v];else selected=e.target.checked?[...new Set([...selected,v])]:selected.filter(x=>x!==v);quiz()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;if(b.dataset.action==="pdf"){pdfOpen=!pdfOpen;pdf.hidden=!pdfOpen;if(pdfOpen)renderPdfReader();draw()}else if(b.dataset.action==="new")build();else if(b.dataset.action==="retry"){pool=shuffle(wrong);i=0;selected=[];checked=false;correct=0;wrong=[];draw()}else if(b.dataset.action==="check"&&!checked){const q=D[pool[i]],good=q[3].length===selected.length&&q[3].every(x=>selected.includes(x));checked=true;if(good)correct++;else wrong.push(pool[i]);quiz()}else if(b.dataset.action==="next"){i++;selected=[];checked=false;quiz()}});
build();
</script></body></html>
